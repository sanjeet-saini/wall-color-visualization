<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Preview paint colours on real room walls with one click." />
    <title>Wall Color Visualizer</title>
    <link rel="icon" href="images/brush.webp" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="left">
        <div class="hometxt">
      <h4>Colour Guide</h4>
      <h2>
        Your Home’s Dream Look Starts <br />
        With A Single Click
      </h2>
        <div id="parentPallet">
          <div class="parent active" id="living">Living</div>
          <div class="parent" id="bedroom">Bedroom</div>
          <div class="parent" id="kitchen">Kitchen</div>
          <div class="parent" id="kidroom">Kids Room</div>
        </div>
      </div>

      <div class="right">
        <div id="childPalette"></div>

        <div class="room">
          <div class="wall">
            <!-- LEFT WALL -->
            <div class="wall-child">
              <img id="leftWall" alt="Left wall of the selected room" />
            </div>

            <!-- RIGHT WALL -->
            <div class="wall-child">
              <img id="rightWall" alt="Right wall of the selected room" />
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
<div class="controls">
  <button id="undoBtn">Undo</button>
  <button id="resetBtn">Reset</button>
</div>



    <script src="script.js"></script>
  </body>
</html>
